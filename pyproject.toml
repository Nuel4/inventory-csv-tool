[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory-csv-tool"
version = "1.0.0"
description = "Command-line tool to check stock levels in an inventory CSV."
requires-python = ">=3.11"
dependencies = ["typer>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
inventory = "app.cli:app"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
